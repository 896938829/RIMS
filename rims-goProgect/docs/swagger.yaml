info:
  contact: {}
  description: 零售端库存管理系统 API
  title: RIMS API
  version: "1.0"
paths:
  /api/v1/audit/logs:
    get:
      description: 分页查询审计日志，支持按用户/仓库/资源/动作/单据号/时间范围过滤。仅管理员可访问。
      parameters:
      - description: 操作人ID
        in: query
        name: userId
        type: integer
      - description: 仓库ID
        in: query
        name: warehouseId
        type: integer
      - description: 资源类型 (user/role/warehouse/product/inventory/non_std_inventory/document/file)
        in: query
        name: resource
        type: string
      - description: 资源ID
        in: query
        name: resourceId
        type: integer
      - description: 动作 (login/create/update/delete/complete/confirm/settle/convert/bind/unbind/assign)
        in: query
        name: action
        type: string
      - description: 单据号
        in: query
        name: docNo
        type: string
      - description: 结果 (success/failure)
        in: query
        name: result
        type: string
      - description: 起始时间 (RFC3339 或 YYYY-MM-DD)
        in: query
        name: startTime
        type: string
      - description: 结束时间 (RFC3339 或 YYYY-MM-DD)
        in: query
        name: endTime
        type: string
      - description: 描述/用户名/单据号关键字
        in: query
        name: keyword
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rims-go_internal_types.Response'
            - properties:
                data:
                  $ref: '#/definitions/rims-go_internal_types.PageResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rims-go_internal_types.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rims-go_internal_types.Response'
      security:
      - BearerAuth: []
      summary: 审计日志列表
      tags:
      - 审计
  /api/v1/audit/logs/{id}:
    get:
      description: 获取单条审计日志的完整内容（含 details JSON）。仅管理员可访问。
      parameters:
      - description: 审计日志ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rims-go_internal_types.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_audit.AuditLogResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rims-go_internal_types.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rims-go_internal_types.Response'
      security:
      - BearerAuth: []
      summary: 审计日志详情
      tags:
      - 审计
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录凭证
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_modules_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rims-go_internal_types.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_user.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rims-go_internal_types.Response'
      summary: 用户登录
      tags:
      - 认证
  /api/v1/documents:
    get:
      description: 分页查询当前仓库的单据，可按类型筛选
      parameters:
      - description: 仓库ID
        in: header
        name: X-Warehouse-ID
        type: integer
      - description: 单据类型 1=入库 2=销售 3=退货 4=调拨 5=盘点 6=转换
        in: query
        name: docType
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 搜索单据号
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rims-go_internal_types.Response'
            - properties:
                data:
                  $ref: '#/definitions/rims-go_internal_types.PageResult'
              type: object
      security:
      - BearerAuth: []
      summary: 单据列表
      tags:
      - 单据
    post:
      consumes:
      - application/json
      description: 创建草稿单据（入库/销售/退货/调拨/盘点/转换）
      parameters:
      - description: 仓库ID
        in: header
        name: X-Warehouse-ID
        type: integer
      - description: 单据信息
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_modules_document.CreateDocumentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/rims-go_internal_types.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_document.DocumentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rims-go_internal_types.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rims-go_internal_types.Response'
      security:
      - BearerAuth: []
      summary: 创建单据
      tags:
      - 单据
  /api/v1/documents/{id}:
    get:
      description: 获取单据及其明细行
      parameters:
      - description: 仓库ID
        in: header
        name: X-Warehouse-ID
        type: integer
      - description: 单据ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rims-go_internal_types.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_document.DocumentDetailResponse'
              type: object
        "404":
          description: Not Found
