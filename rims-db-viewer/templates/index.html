{% extends "base.html" %}
{% block title %}Tables - RIMS DB Viewer{% endblock %}

{% block content %}
<h4 class="mb-3">Database Tables</h4>
<table class="table table-striped table-hover table-sm">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Table Name</th>
            <th>Estimated Rows</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for name, rows in tables %}
        <tr>
            <td>{{ loop.index }}</td>
            <td><a href="/table/{{ name }}">{{ name }}</a></td>
            <td>{{ rows }}</td>
            <td>
                <a href="/table/{{ name }}" class="btn btn-sm btn-outline-primary">Browse</a>
                <a href="/table/{{ name }}/structure" class="btn btn-sm btn-outline-secondary">Structure</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
